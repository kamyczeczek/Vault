providers:
  autoThinkingMaxEffort: xhigh
disabledProviders:
  - ollama
symbolPreset: nerd
composer:
  shape: box
theme:
  dark: titanium
setupVersion: 2
defaultThinkingLevel: auto
cycleOrder: []
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project
  autoRecall: true
  autoRetain: true
task:
  enableEffort: true
dev:
  autoqaConsent: denied
inlineToolDescriptors: "off"
pruneToolDescriptions: true
thinkingBudgets:
  minimal: 512
  low: 1024
  medium: 4096
compaction:
  thresholdPercent: 75
  methodOrder:
    - shake
    - remote
    - soft
    - snapcompact
cacheRetention: long
read:
  defaultLimit: 200
display:
  showTokenUsage: true
tools:
  artifactTailLines: 150
